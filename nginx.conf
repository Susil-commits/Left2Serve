events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    upstream backend_cluster {
        server backend:5000;
        keepalive 32;
    }

    upstream nextjs_ssr {
        server frontend-next:3000;
        keepalive 32;
    }

    upstream vite_spa {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. API, Metrics, Static uploads & Socket.IO -> Go Backend
        location ~ ^/(api|socket\.io|metrics|uploads|trpc) {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # WebSocket upgrade support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 2. Next.js 15 SSR Pages (Landing, Listings Feed, Details, Impact, Donor Create)
        location ~ ^/(_next|listings|impact|donor) {
            proxy_pass http://nextjs_ssr;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js Exact Root Landing Page
        location = / {
            proxy_pass http://nextjs_ssr;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Interactive Client SPA (Dashboards, Map Clustering, Real-Time Chat, Admin, QR)
        location / {
            proxy_pass http://vite_spa;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

